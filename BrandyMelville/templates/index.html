<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <div class="row">
        <div class="col-md-3">
            <h5>Categories</h5>
            <ul class="list-unstyled">
                <li><a href="/" class="text-decoration-none text-dark">All Items</a></li>
                <hr>
                <li><strong>Tops</strong>
                    <ul class="ps-3 list-unstyled">
                        <li><a href="/?category=Tops&sub=Tanks">Tanks</a></li>
                        <li><a href="/?category=Tops&sub=Tees">Tees</a></li>
                        <li><a href="/?category=Tops&sub=Long Sleeves">Long Sleeves</a></li>
                    </ul>
                </li>
                <li class="mt-2"><strong>Bottoms</strong>
                    <ul class="ps-3 list-unstyled">
                        <li><a href="/?category=Bottoms&sub=Skirts">Skirts</a></li>
                        <li><a href="/?category=Bottoms&sub=Pants">Pants</a></li>
                    </ul>
                </li>
            </ul>
        </div>

        <div class="col-md-9">
            <div class="row">
                {% for item in items %}
                {% endfor %}
            </div>
        </div>
    </div>
    <h1 class="text-center mb-4">Brandy Melville Archive</h1>

    <form action="/" method="get" class="d-flex mb-5">
        <input class="form-control me-2" type="search" name="search"
            placeholder="Search for a hoodie, top, or color...">
        <button class="btn btn-dark" type="submit">Search</button>
    </form>

    <div class="row">
        {% for item in items %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text text-muted">{{ item.color }} • {{ item.item_type }}</p>
                    <a href="#" class="btn btn-outline-secondary btn-sm">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
